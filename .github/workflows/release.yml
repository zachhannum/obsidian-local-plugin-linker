name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag against the versions
        run: |
          for file in manifest.json package.json; do
            version=$(node -p "require('./$file').version")
            if [ "$version" != "$TAG" ]; then
              echo "$file says $version, the tag says $TAG" >&2
              exit 1
            fi
          done
      - run: npm run build
      - run: npm test
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "main.js, manifest.json, styles.css"
      - name: Attach the plugin to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" main.js manifest.json styles.css --clobber
