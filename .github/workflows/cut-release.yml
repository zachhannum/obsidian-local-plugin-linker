name: Cut a release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      # Main's ruleset lets only the release app push. A tag pushed with
      # `GITHUB_TOKEN` starts no workflow run.
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Bump the version and tag it
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$BUMP" -m "Release %s"
          version=$(node -p "require('./package.json').version")
          # The branch goes first, so no tag points at a commit that main
          # did not take.
          git push origin "HEAD:$GITHUB_REF_NAME"
          git push origin "$version"
